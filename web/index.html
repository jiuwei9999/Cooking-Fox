<!doctype html>
<html lang="zh-CN">
  <!-- cache v7 -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>狐闹厨房 · Cooking-Fox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="errors" style="position:fixed;bottom:0;left:0;right:0;max-height:30vh;overflow:auto;background:rgba(255,0,0,0.1);color:red;font-family:monospace;font-size:11px;z-index:9999;padding:8px;display:none"></div>
    <button id="layoutToggle" title="切换桌面/手机排版" style="position:fixed;bottom:16px;right:16px;z-index:10000;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(15,22,45,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.3);transition:all 0.25s;line-height:1">📱</button>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
      }
    }
    </script>
    <script>
    var errEl = document.getElementById("errors");
    function _escHtml(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }
    window.onerror = function(msg, url, line, col, err) {
      errEl.style.display = "block";
      var div = document.createElement("div");
      div.textContent = "ERROR: " + msg + " at " + url + ":" + line;
      errEl.appendChild(div);
      if (err && err.stack) {
        var pre = document.createElement("pre");
        pre.style.fontSize = "9px";
        pre.textContent = err.stack;
        errEl.appendChild(pre);
      }
    };
    window.addEventListener("unhandledrejection", function(e) {
      errEl.style.display = "block";
      var div = document.createElement("div");
      div.textContent = "PROMISE: " + e.reason;
      errEl.appendChild(div);
    });
    // ── 布局切换：桌面 / 手机 ──
    (function() {
      var STORAGE_KEY = "cookingsim.layout";
      var btn = document.getElementById("layoutToggle");
      function isMobile() { return document.body.classList.contains("layout-mobile"); }
      function setIcon() { btn.textContent = isMobile() ? "💻" : "📱"; btn.title = isMobile() ? "切换为桌面排版" : "切换为手机排版"; }
      function applyLayout(mobile) {
        if (mobile) document.body.classList.add("layout-mobile");
        else document.body.classList.remove("layout-mobile");
        setIcon();
      }
      // 初始化：优先 localStorage > 小屏自动检测
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved === "mobile") applyLayout(true);
      else if (saved === "desktop") applyLayout(false);
      else if (window.innerWidth < 768) applyLayout(true);
      btn.addEventListener("click", function() {
        var next = !isMobile();
        applyLayout(next);
        localStorage.setItem(STORAGE_KEY, next ? "mobile" : "desktop");
      });
      // 窗口大小变化时自动更新图标（但不强制改变布局）
      window.addEventListener("resize", setIcon);
    })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
